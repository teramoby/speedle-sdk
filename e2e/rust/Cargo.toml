[package]
name = "speedle-e2e"
version = "0.0.0"
edition = "2021"
license = "UPL-1.0"
publish = false
description = "Speedle SDK end-to-end runner for Rust"

# Not part of any workspace: the runner builds the SDK from ../../rust.
[workspace]

[dependencies]
speedle = { path = "../../rust", features = ["blocking"] }
serde_json = "1.0.108"
