[package]
name = "speedle"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["The Speedle Authors"]
license = "UPL-1.0"
description = "Client for the Speedle authorization decision service (Speedle Cloud and self-hosted Speedle)"
repository = "https://github.com/teramoby/speedle-sdk"
homepage = "https://speedle.io"
documentation = "https://docs.rs/speedle"
readme = "README.md"
keywords = ["speedle", "authorization", "policy", "access-control", "abac"]
categories = ["api-bindings", "authentication", "web-programming::http-client"]
include = ["src/**/*.rs", "build.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[features]
default = []
blocking = ["tokio/rt-multi-thread"]

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "http2"] }
rustls = { version = "0.23", default-features = false }
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1.0.108"
tokio = { version = "1.38", features = ["time"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[package.metadata.docs.rs]
all-features = true
