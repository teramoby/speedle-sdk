name: java

on:
  push:
    branches: [main]
    paths:
      - "java/**"
      - "conformance/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java/**"
      - "conformance/**"
      - ".github/workflows/java.yml"

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Format (google-java-format), javac -Xlint:all -Werror, Javadoc doclint
        run: mvn -B -ntp spotless:check compile javadoc:javadoc

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Unit tests
        run: mvn -B -ntp test
      - name: Build the conformance mock
        run: go build -C ../conformance/mock -o "$RUNNER_TEMP/speedle-mock" .
      - name: Conformance vectors against conformance/mock
        run: >-
          mvn -B -ntp test -Pconformance
          -Dspeedle.mock="$RUNNER_TEMP/speedle-mock"
          -Dspeedle.requireSharedMock=true
