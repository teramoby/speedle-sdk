# Stable privileged shell: stage logic lives in .github/codex/, never in this file.
# Adapted from Pavu a7b458e; Apache-2.0; see .github/codex/PAVU-LICENSE.txt.
name: ReviewBot

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] validated same-repo PR association; trusted checkout only; no source artifacts or PR code executed
    workflows: [ReviewBot PR Event]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: reviewbot-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate PR event
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.event.outputs.should_run }}
      pull_number: ${{ steps.event.outputs.pull_number }}
      head_sha: ${{ steps.event.outputs.head_sha }}
      base_sha: ${{ steps.event.outputs.base_sha }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate authoritative PR association
        id: event
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const stage = require(`${process.env.GITHUB_WORKSPACE}/.github/codex/reviewbot_github.js`);
            await stage.validatePrEvent({ github, context, core });

  review:
    name: Analyze pull request
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ${{ fromJSON(vars.REVIEWBOT_RUNS_ON || '["self-hosted","Linux","reviewbot"]') }}
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    # The report travels as a validated same-run artifact, not a job output.
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      should_review: ${{ steps.gate.outputs.should_review }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check configuration and existing review
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEWBOT_PROVIDER: ${{ vars.REVIEWBOT_PROVIDER }}
          REVIEWBOT_API_KEY: ${{ secrets.ARK_API_KEY }}
          REVIEWBOT_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REVIEWED_COMMIT: ${{ needs.prepare.outputs.head_sha }}
          PULL_NUMBER: ${{ needs.prepare.outputs.pull_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const stage = require(`${process.env.GITHUB_WORKSPACE}/.github/codex/reviewbot_github.js`);
            await stage.reviewGate({ github, context, core });
      - name: Run trusted ReviewBot analysis
        id: review
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.should_review == 'true'
        shell: bash
        env:
          REVIEWBOT_PROVIDER: ${{ vars.REVIEWBOT_PROVIDER }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_REVIEW_MODELS: ${{ vars.ARK_REVIEW_MODELS }}
          ARK_REVIEW_MODEL: ${{ vars.ARK_REVIEW_MODEL }}
          ARK_REVIEW_MAX_OUTPUT_TOKENS: ${{ vars.ARK_REVIEW_MAX_OUTPUT_TOKENS }}
          ARK_REVIEW_REASONING_EFFORT: ${{ vars.ARK_REVIEW_REASONING_EFFORT }}
          ARK_REVIEW_INPUT_LIMIT: ${{ vars.ARK_REVIEW_INPUT_LIMIT }}
          DEEPSEEK_REVIEW_MODEL: ${{ vars.DEEPSEEK_REVIEW_MODEL }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: bash .github/codex/reviewbot_analyze.sh review
      - name: Validate and seal review handoff
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.should_review == 'true'
        shell: bash
        env:
          # Only this trusted, network-free guard sees all secrets, never the model.
          REVIEWBOT_PROVIDER: ${{ vars.REVIEWBOT_PROVIDER }}
          REVIEWBOT_SECRETS: ${{ toJSON(secrets) }} # zizmor: ignore[overprovisioned-secrets] the guard must reject every available secret before artifact upload, including future/inherited secrets
          GH_TOKEN: ${{ github.token }}
          REVIEWBOT_RETRIED: ${{ steps.review.outputs.retried }}
          PULL_NUMBER: ${{ needs.prepare.outputs.pull_number }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          COMMAND: review
        run: >-
          python3 .github/codex/reviewbot_handoff.py
          "${RUNNER_TEMP}/reviewbot-result.json"
          "${RUNNER_TEMP}/reviewbot-handoff/report.json"
      - name: Upload validated review handoff
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.should_review == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewbot-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewbot-handoff/report.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove review input
        if: always()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/reviewbot-handoff"
          rm -f "${RUNNER_TEMP}"/reviewbot-*

  publish:
    name: Publish pull request review
    needs: [prepare, review]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ${{ fromJSON(vars.REVIEWBOT_RUNS_ON || '["self-hosted","Linux","reviewbot"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download validated review handoff from this run only
        if: needs.review.result == 'success' && needs.review.outputs.enabled == 'true' && needs.review.outputs.should_review == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewbot-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewbot-handoff
      - name: Publish idempotent review
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ANALYZE_RESULT: ${{ needs.review.result }}
          REVIEWBOT_ENABLED: ${{ needs.review.outputs.enabled }}
          SHOULD_REVIEW: ${{ needs.review.outputs.should_review }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          COMMAND: review
          REVIEWED_COMMIT: ${{ needs.prepare.outputs.head_sha }}
          PULL_NUMBER: ${{ needs.prepare.outputs.pull_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const stage = require(`${process.env.GITHUB_WORKSPACE}/.github/codex/reviewbot_github.js`);
            await stage.publishReview({ github, context, core });
      - name: Remove downloaded review handoff
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}/reviewbot-handoff"
