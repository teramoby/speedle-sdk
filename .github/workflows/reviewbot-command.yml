# Stable privileged shell: stage logic lives in .github/codex/, never in this file.
# Adapted from Pavu a7b458e; Apache-2.0; see .github/codex/PAVU-LICENSE.txt.
name: ReviewBot Commands

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] validated pointer routers; comments re-read via API; no source artifacts or PR code executed
    workflows: [ReviewBot Comment Command, ReviewBot Inline Command]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: reviewbot-command-${{ github.event_name }}-${{ github.event.comment.id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Authorize ReviewBot command
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      should_run: ${{ steps.command.outputs.should_run }}
      command: ${{ steps.command.outputs.command }}
      pull_number: ${{ steps.command.outputs.pull_number }}
      base_sha: ${{ steps.command.outputs.base_sha }}
      head_sha: ${{ steps.command.outputs.head_sha }}
      actor: ${{ steps.command.outputs.actor }}
      comment_id: ${{ steps.command.outputs.comment_id }}
      reply_to_comment_id: ${{ steps.command.outputs.reply_to_comment_id }}
      source_kind: ${{ steps.command.outputs.source_kind }}
      source_url: ${{ steps.command.outputs.source_url }}
      request_b64: ${{ steps.command.outputs.request_b64 }}
      context_b64: ${{ steps.command.outputs.context_b64 }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Parse and authorize command
        id: command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const stage = require(`${process.env.GITHUB_WORKSPACE}/.github/codex/reviewbot_github.js`);
            await stage.prepareCommand({ github, context, core });

  analyze:
    name: Analyze ReviewBot command
    needs: prepare
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ["self-hosted","aliyun-ecs","reviewbot"]
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check configuration and collect command history
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEWBOT_PROVIDER: ${{ vars.REVIEWBOT_PROVIDER }}
          REVIEWBOT_API_KEY: ${{ secrets.ARK_API_KEY }}
          REVIEWBOT_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PULL_NUMBER: ${{ needs.prepare.outputs.pull_number }}
          COMMAND: ${{ needs.prepare.outputs.command }}
        with:
          github-token: ${{ github.token }}
          script: |
            const stage = require(`${process.env.GITHUB_WORKSPACE}/.github/codex/reviewbot_github.js`);
            await stage.commandAnalyzeGate({ github, context, core });
      - name: Run trusted command analysis
        id: review
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          REVIEWBOT_PROVIDER: ${{ vars.REVIEWBOT_PROVIDER }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARK_REVIEW_MODELS: ${{ vars.ARK_REVIEW_MODELS }}
          ARK_REVIEW_MODEL: ${{ vars.ARK_REVIEW_MODEL }}
          ARK_REVIEW_MAX_OUTPUT_TOKENS: ${{ vars.ARK_REVIEW_MAX_OUTPUT_TOKENS }}
          ARK_REVIEW_REASONING_EFFORT: ${{ vars.ARK_REVIEW_REASONING_EFFORT }}
          ARK_REVIEW_INPUT_LIMIT: ${{ vars.ARK_REVIEW_INPUT_LIMIT }}
          DEEPSEEK_REVIEW_MODEL: ${{ vars.DEEPSEEK_REVIEW_MODEL }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          TRUSTED_SHA: ${{ github.workflow_sha }}
          COMMAND: ${{ needs.prepare.outputs.command }}
          REQUEST_B64: ${{ needs.prepare.outputs.request_b64 }}
          CONTEXT_B64: ${{ needs.prepare.outputs.context_b64 }}
          HISTORY_B64: ${{ steps.gate.outputs.history_b64 }}
        run: bash .github/codex/reviewbot_analyze.sh command
      - name: Validate and seal review handoff
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        env:
          # Only this trusted, network-free guard sees all secrets, never the model.
          REVIEWBOT_PROVIDER: ${{ vars.REVIEWBOT_PROVIDER }}
          REVIEWBOT_SECRETS: ${{ toJSON(secrets) }} # zizmor: ignore[overprovisioned-secrets] the guard must reject every available secret before artifact upload, including future/inherited secrets
          GH_TOKEN: ${{ github.token }}
          REVIEWBOT_RETRIED: ${{ steps.review.outputs.retried }}
          PULL_NUMBER: ${{ needs.prepare.outputs.pull_number }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          COMMAND: ${{ needs.prepare.outputs.command }}
        run: >-
          python3 .github/codex/reviewbot_handoff.py
          "${RUNNER_TEMP}/reviewbot-command-result.json"
          "${RUNNER_TEMP}/reviewbot-handoff/report.json"
      - name: Upload validated review handoff
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewbot-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewbot-handoff/report.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove command input
        if: always()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/reviewbot-handoff"
          rm -f "${RUNNER_TEMP}"/reviewbot-command-*

  publish:
    name: Publish ReviewBot command response
    needs: [prepare, analyze]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ["self-hosted","aliyun-ecs","reviewbot"]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download validated review handoff from this run only
        if: needs.analyze.result == 'success' && needs.analyze.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewbot-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reviewbot-handoff
      - name: Publish idempotent response
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          REVIEWBOT_ENABLED: ${{ needs.analyze.outputs.enabled }}
          COMMAND: ${{ needs.prepare.outputs.command }}
          PULL_NUMBER: ${{ needs.prepare.outputs.pull_number }}
          HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          ACTOR: ${{ needs.prepare.outputs.actor }}
          COMMENT_ID: ${{ needs.prepare.outputs.comment_id }}
          REPLY_TO_COMMENT_ID: ${{ needs.prepare.outputs.reply_to_comment_id }}
          SOURCE_KIND: ${{ needs.prepare.outputs.source_kind }}
          SOURCE_URL: ${{ needs.prepare.outputs.source_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const stage = require(`${process.env.GITHUB_WORKSPACE}/.github/codex/reviewbot_github.js`);
            await stage.publishCommand({ github, context, core });
      - name: Remove downloaded review handoff
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}/reviewbot-handoff"
