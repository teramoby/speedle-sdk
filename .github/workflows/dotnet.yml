name: dotnet

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - "conformance/**"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "conformance/**"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Speedle.Sdk.sln
      - name: Format (whitespace and code style)
        run: |
          dotnet format whitespace Speedle.Sdk.sln --verify-no-changes
          dotnet format style Speedle.Sdk.sln --verify-no-changes --severity warn --no-restore
      - name: Build with analyzers, warnings as errors
        run: dotnet build Speedle.Sdk.sln -c Release --no-restore
      - name: Pack (metadata check only, nothing is published)
        run: dotnet pack src/Speedle.Sdk/Speedle.Sdk.csproj -c Release --no-build -o "$RUNNER_TEMP/pkg"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: ["net8.0", "net10.0"]
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Build
        run: dotnet build Speedle.Sdk.sln -c Release
      - name: Unit tests
        run: >-
          dotnet test Speedle.Sdk.sln -c Release --no-build
          --framework ${{ matrix.framework }}
          --filter "Category!=Conformance"
      - name: Build the conformance mock
        run: go build -C ../conformance/mock -o "$RUNNER_TEMP/speedle-mock" .
      - name: Conformance vectors against conformance/mock
        env:
          SPEEDLE_MOCK: ${{ runner.temp }}/speedle-mock
        run: >-
          dotnet test Speedle.Sdk.sln -c Release --no-build
          --framework ${{ matrix.framework }}
          --filter "Category=Conformance"
