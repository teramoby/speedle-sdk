# Tag-driven release of one SDK per run; see RELEASING.md and design §12.3.
#
# A tag `<language>/vX.Y.Z` on a commit of `main` runs:
#   verify          tag format, commit on main, tag version == package metadata
#   <language>      build, unit tests, conformance against conformance/mock and
#                   the package artifact; no secrets and no OIDC token
#   publish-<lang>  in the protected `release` environment, publishes only that
#                   artifact (npm, PyPI, NuGet, crates.io: trusted publishing;
#                   Maven Central: user token and GPG key)
#   Go has no publish job: the tag push is the release (RELEASING.md, Go).
#   go-proxy        after the build and test job, without the `release`
#                   environment, confirms the version on proxy.golang.org
#
# Only tag pushes trigger it: no pull_request, workflow_run or manual trigger,
# so PR code never runs here. Caches are off so a release never restores state
# written by another run.
name: release

on:
  push:
    tags:
      - "node/v[0-9]+.[0-9]+.[0-9]+"
      - "python/v[0-9]+.[0-9]+.[0-9]+"
      - "java/v[0-9]+.[0-9]+.[0-9]+"
      - "go/v[0-9]+.[0-9]+.[0-9]+"
      - "dotnet/v[0-9]+.[0-9]+.[0-9]+"
      - "rust/v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      language: ${{ steps.tag.outputs.language }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          }
          echo "$GITHUB_REF_NAME -> $GITHUB_SHA is on main"
      - name: Tag version matches the package metadata
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release-version.py "$TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- Node.js
  node:
    name: node build and test
    needs: verify
    if: needs.verify.outputs.language == 'node'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conformance/mock/go.mod
          cache: false
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Conformance
        run: npm run conformance
      - name: Build and package smoke test (ESM and CJS)
        run: npm run test:package
      - name: Pack
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/speedle-sdk-$VERSION.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  publish-node:
    name: Publish @speedle/sdk to npm
    needs: [verify, node]
    if: needs.verify.outputs.language == 'node'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.npmjs.com/package/@speedle/sdk/v/${{ needs.verify.outputs.version }}
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      # No `registry-url` here. With it, setup-node (src/authutil.ts in v7.1.0)
      # always writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` to
      # $RUNNER_TEMP/.npmrc and points NPM_CONFIG_USERCONFIG at it, so an unset
      # or empty NODE_AUTH_TOKEN still leaves an (empty) _authToken entry. npm
      # tries OIDC first and falls back to that configured token
      # (https://docs.npmjs.com/trusted-publishers), and its OIDC code
      # (lib/utils/oidc.js) returns quietly on a failed exchange, so a broken
      # trust setup would surface as a misleading auth error. Trusted
      # publishing needs no token, and npm's default registry is
      # registry.npmjs.org.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-dist
          path: dist
      # NPM_BOOTSTRAP_TOKEN is only for the first release, before the package
      # exists and trusted publishing can be configured (RELEASING.md). Once
      # the package exists on npm, a still-set token fails the job, so it can
      # never silently replace trusted publishing.
      - name: Authentication mode
        id: mode
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            status=$(curl -sS -o /dev/null -w '%{http_code}' https://registry.npmjs.org/@speedle%2fsdk) || status=error
            case "$status" in
              404) ;;
              200)
                echo "::error::@speedle/sdk already exists on npm but the release environment secret NPM_BOOTSTRAP_TOKEN is still set. Delete that secret (and revoke the token on npmjs.com) so this release uses trusted publishing (RELEASING.md, npm)."
                exit 1 ;;
              *)
                echo "::error::could not check whether @speedle/sdk exists on npm (HTTP $status); refusing to publish with NPM_BOOTSTRAP_TOKEN"
                exit 1 ;;
            esac
            echo "mode=bootstrap-token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=trusted-publishing" >> "$GITHUB_OUTPUT"
          fi
      - name: npm publish (trusted publishing)
        if: steps.mode.outputs.mode == 'trusted-publishing'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: npm publish "dist/speedle-sdk-$VERSION.tgz" --provenance --access public --ignore-scripts --registry https://registry.npmjs.org/
      # Bootstrap only: a step-local userconfig with the same line setup-node
      # would write. npm expands ${NODE_AUTH_TOKEN} from the environment when
      # it reads the file, so the token itself never lands on disk.
      - name: npm publish (one-time bootstrap token)
        if: steps.mode.outputs.mode == 'bootstrap-token'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-bootstrap.npmrc
        run: |
          # shellcheck disable=SC2016 # the literal ${NODE_AUTH_TOKEN} is for npm to expand
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          npm publish "dist/speedle-sdk-$VERSION.tgz" --provenance --access public --ignore-scripts --registry https://registry.npmjs.org/

  # ----------------------------------------------------------------- Python
  python:
    name: python build and test
    needs: verify
    if: needs.verify.outputs.language == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conformance/mock/go.mod
          cache: false
      - run: uv sync --locked
      - name: Unit tests
        run: uv run pytest tests --ignore=tests/conformance
      - name: Conformance
        run: uv run pytest tests/conformance
      - name: Build sdist and wheel
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv build --no-sources -o "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/speedle-$VERSION.tar.gz"
          test -f "$RUNNER_TEMP/dist/speedle-$VERSION-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  publish-python:
    name: Publish speedle to PyPI
    needs: [verify, python]
    if: needs.verify.outputs.language == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/project/speedle/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write # PyPI trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  # ------------------------------------------------------------------- Java
  java:
    name: java build and test
    needs: verify
    if: needs.verify.outputs.language == 'java'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conformance/mock/go.mod
          cache: false
      - name: Unit tests
        run: mvn -B -ntp test
      - name: Build the conformance mock
        run: go build -C ../conformance/mock -o "$RUNNER_TEMP/speedle-mock" .
      - name: Conformance vectors against conformance/mock
        run: >-
          mvn -B -ntp test -Pconformance
          -Dspeedle.mock="$RUNNER_TEMP/speedle-mock"
          -Dspeedle.requireSharedMock=true
      - name: Package jar, sources and Javadoc (unsigned check)
        run: mvn -B -ntp -Prelease -Dgpg.skip -DskipTests verify

  publish-java:
    name: Publish io.speedle:speedle-sdk to Maven Central
    needs: [verify, java]
    if: needs.verify.outputs.language == 'java'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: release
      url: https://central.sonatype.com/artifact/io.speedle/speedle-sdk/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Writes ~/.m2/settings.xml with server central-portal whose username and
      # password are ${env.MAVEN_CENTRAL_USERNAME} and ${env.MAVEN_CENTRAL_PASSWORD}.
      # A separate server id keeps the token off dependency downloads from the
      # `central` repository.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          server-id: central-portal
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
      - name: Sign and publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease -DskipTests deploy

  # --------------------------------------------------------------------- Go
  go:
    name: go build and test
    needs: verify
    if: needs.verify.outputs.language == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test -short -race -count=1 ./...
      - name: Conformance (every vector against conformance/mock)
        run: go test -race -count=1 -run '^TestConformance$' -v .

  # The pushed tag is already the Go release: anyone can fetch it through
  # proxy.golang.org before any job here runs, so a `release` environment
  # approval would gate nothing. This job only confirms the published version
  # on proxy.golang.org and sum.golang.org. The gate for Go is the maintainer
  # check before the tag push (RELEASING.md, Go).
  go-proxy:
    name: Confirm github.com/teramoby/speedle-sdk/go on proxy.golang.org
    needs: [verify, go]
    if: needs.verify.outputs.language == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: go mod download from proxy.golang.org
        working-directory: ${{ runner.temp }}
        env:
          MODULE: github.com/teramoby/speedle-sdk/go@v${{ needs.verify.outputs.version }}
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ""
          GONOPROXY: ""
          GONOSUMDB: ""
          GOFLAGS: ""
        run: |
          for attempt in 1 2 3 4 5 6; do
            if go mod download -json "$MODULE" > module.json; then
              cat module.json
              jq -e --arg v "${MODULE##*@}" '.Version == $v and (.Error // "") == ""' module.json > /dev/null
              exit 0
            fi
            cat module.json || true
            echo "attempt $attempt: $MODULE not available yet; retrying in 30 s"
            sleep 30
          done
          echo "::error::proxy.golang.org could not fetch $MODULE"
          exit 1

  # ------------------------------------------------------------------- .NET
  dotnet:
    name: dotnet build and test
    needs: verify
    if: needs.verify.outputs.language == 'dotnet'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conformance/mock/go.mod
          cache: false
      - name: Build
        run: dotnet build Speedle.Sdk.sln -c Release
      - name: Unit tests (net8.0 and net10.0)
        run: dotnet test Speedle.Sdk.sln -c Release --no-build --filter "Category!=Conformance"
      - name: Build the conformance mock
        run: go build -C ../conformance/mock -o "$RUNNER_TEMP/speedle-mock" .
      - name: Conformance vectors against conformance/mock
        env:
          SPEEDLE_MOCK: ${{ runner.temp }}/speedle-mock
        run: dotnet test Speedle.Sdk.sln -c Release --no-build --filter "Category=Conformance"
      - name: Pack
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          dotnet pack src/Speedle.Sdk/Speedle.Sdk.csproj -c Release --no-build -o "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/Speedle.Sdk.$VERSION.nupkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  publish-dotnet:
    name: Publish Speedle.Sdk to NuGet
    needs: [verify, dotnet]
    if: needs.verify.outputs.language == 'dotnet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://www.nuget.org/packages/Speedle.Sdk/${{ needs.verify.outputs.version }}
    permissions:
      id-token: write # NuGet trusted publishing
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dotnet-dist
          path: dist
      - name: NUGET_USER is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          [ -n "$NUGET_USER" ] || {
            echo "::error::Set the release environment variable NUGET_USER (RELEASING.md)"
            exit 1
          }
      - name: NuGet login (OIDC to a short-lived API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: dotnet nuget push
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "dist/Speedle.Sdk.$VERSION.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json

  # ------------------------------------------------------------------- Rust
  rust:
    name: rust build and test
    needs: verify
    if: needs.verify.outputs.language == 'rust'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: conformance/mock/go.mod
          cache: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: Unit tests (default features)
        run: cargo test --locked
      - name: Unit tests (all features)
        run: cargo test --locked --all-features
      - name: Conformance (every vector against conformance/mock)
        run: cargo test --locked --lib conformance -- --ignored --nocapture
      - name: Package and verify the crate
        run: cargo package --locked

  publish-rust:
    name: Publish speedle to crates.io
    needs: [verify, rust]
    if: needs.verify.outputs.language == 'rust'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://crates.io/crates/speedle/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      # CARGO_BOOTSTRAP_TOKEN is only for the first release, before the crate
      # exists and trusted publishing can be configured (RELEASING.md). Once
      # the crate exists on crates.io, a still-set token fails the job, so it
      # can never silently replace trusted publishing.
      - name: Authentication mode
        id: mode
        env:
          CARGO_BOOTSTRAP_TOKEN: ${{ secrets.CARGO_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$CARGO_BOOTSTRAP_TOKEN" ]; then
            # crates.io rejects API requests without a User-Agent.
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "speedle-sdk release workflow (https://github.com/$GITHUB_REPOSITORY)" \
              https://crates.io/api/v1/crates/speedle) || status=error
            case "$status" in
              404) ;;
              200)
                echo "::error::the crate speedle already exists on crates.io but the release environment secret CARGO_BOOTSTRAP_TOKEN is still set. Delete that secret (and revoke the token on crates.io) so this release uses trusted publishing (RELEASING.md, crates.io)."
                exit 1 ;;
              *)
                echo "::error::could not check whether the crate speedle exists on crates.io (HTTP $status); refusing to publish with CARGO_BOOTSTRAP_TOKEN"
                exit 1 ;;
            esac
            echo "mode=bootstrap-token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=trusted-publishing" >> "$GITHUB_OUTPUT"
          fi
      - name: crates.io login (OIDC to a short-lived token)
        id: auth
        if: steps.mode.outputs.mode == 'trusted-publishing'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # The rust job already built and verified this package from the same
      # commit, so --no-verify skips compiling dependencies while a token is set.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_BOOTSTRAP_TOKEN }}
        run: cargo publish --locked --no-verify
