name: python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "conformance/**"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "conformance/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run mypy
      - name: Unit tests
        run: uv run pytest tests --ignore=tests/conformance
      - name: Conformance
        run: uv run pytest tests/conformance
      - name: Build
        run: uv build -o "$RUNNER_TEMP/dist"
